name: Docker Publish

on:
  push:
    branches: [ main, next ]
    tags: [ 'v*' ]
env:
  GCP_ARTIFACT_HOST: ${{ vars.SHARED_WIF_LOCATON }}-docker.pkg.dev
  GCP_REGISTRY: ${{ vars.SHARED_WIF_LOCATON }}-docker.pkg.dev/${{ vars.SHARED_WIF_PROJECT }}/${{ vars.SHARED_WIF_REPO }}
  GCP_BEI_REGISTRY: ${{ vars.SHARED_WIF_LOCATON }}-docker.pkg.dev/${{ vars.SHARED_WIF_PROJECT }}/bei
  NODE_VERSION: 24
  YARN_VERSION: 4.18.0

jobs:
  docker-publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        # v7.0.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      # v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Install yarn
        run: |
          corepack enable
          corepack prepare yarn@${{ env.YARN_VERSION }} --activate
      - name: Install packages
        run: yarn install --immutable
      - name: Run linter
        run: yarn run lint
      - name: Build applications
        run: yarn workspaces foreach --all --parallel --topological run build

      - name: Google Auth
        id: 'auth'
        # v3.0.0
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: "${{ vars.SHARED_WIF_PROVIDER }}"
          service_account: "${{ vars.SHARED_WIF_SERVICE_ACCOUNT }}"
          token_format: 'access_token'

      - name: Docker Login
        # v4.6.0
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ${{ env.GCP_ARTIFACT_HOST }}
          username: 'oauth2accesstoken'
          password: ${{ steps.auth.outputs.access_token }}

      # Setup QEMU for multi-platform / arm64 support
      - name: Setup QEMU
        # v4.2.0
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8

      - name: Docker Buildx Setup
        # v4.3.0
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e

      - name: Docker Metadata
        id: meta
        # v6.2.0
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302
        with:
          images: ${{ env.GCP_REGISTRY }}/__service__
          tags: |
            type=raw,value=v-latest
            type=ref,event=tag
            type=sha
          flavor: |
            latest=false

      - name: Docker Build
        # v7.3.0
        uses: docker/bake-action@d3418bd7d0e9324001bca92fa8ba175ea7e6dc9b
        env:
          REPO: ${{ env.GCP_BEI_REGISTRY }}
        with:
          source: .
          targets: |
            portal-data-availability
            portal-data-product-detail
            portal-explore-data-products
            portal-prototype-data
            portal-samples
            portal-taxon
          files: |
            ./docker-bake.hcl
            ${{ steps.meta.outputs.bake-file }}
          push: true
